[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extracao-clinica-sasi"
version = "0.1.0"
description = "Motor local e determinístico para compilar extrações clínicas do SASI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sasi-clinical = "extracao_clinica_sasi.cli:main"
sasi-clinical-server = "extracao_clinica_sasi.server:main"

[tool.setuptools.packages.find]
where = ["src"]
